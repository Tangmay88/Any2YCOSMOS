<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Picture Puzzle Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./style.css">


</head>
<body>
<!-- partial:index.partial.html -->
<!--<div>
	<img src="images/logo.gif" style="width: 410px;height: auto;margin-left: 18px;">
  </div>-->

  <div  style="display: flex; justify-content: center; align-items: center; margin-top: 30px; ">
    <img src="images/logo.gif" style="width: 445px;height: auto;margin-bottom: -80px;">
</div>
  
<div id="container">	
	<a href="#" class="button start">Start</a>
	<audio id="bgMusic" preload="auto"></audio>
	<div class="box">	
		<div class="me full"></div>
	</div>
	<div class="pre_img">	
		<li data-bid="0"><img src="images/img_Puzzle/cosmos.jpg"></li>
		<li data-bid="1"><img src="images/img_Puzzle/sun_1.jpg"></li>
		<li data-bid="2"><img src="images/img_Puzzle/cygnus_2.jpg"></li>	
		<li data-bid="3"><img src="images/img_Puzzle/bbrun.jpg"></li>
		<li data-bid="4"><img src="images/img_Puzzle/cygnus.jpg"></li>	
		<li data-bid="5"><img src="images/img_Puzzle/kiss.jpg"></li>	
		<li data-bid="6"><img src="images/img_Puzzle/unititled.jpg"></li>	
		<li data-bid="7" id="upfile1"><img src="https://image.ibb.co/cXSomR/upload1.png" /></li>
		<input type="file" name="image" id="file1" style="display: none">
	</div>
	<div align="center"><a href="#" class="button reset" align="center">Reset</a></div>
</div>

<div class="cover" >
	<div class="score">
		<p id="scr_head"> &#9875 Puzzel Complete &#9875</p>
		<p id="scr_time"> Time : <span id="min">00</span> Min <span id="sec">00</span> Sec</p>
		<p id="scr_moves"> Moves : <span id="moves"></span></p>
		<p class="i">💜 Thank you for joining in the fun 🙏</p>
		<div class="button OK">OK</div>
	</div>
</div>

<!-- partial -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script><script  src="./script.js"></script>

</html>
